<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: aliceblue;
        }

        .wrapper {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            gap: 10px;
        }

        header {
            background-color: aqua;
            padding: 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            border: 3px solid black;
        }

        nav {
            background-color: aquamarine;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 3px solid black;
        }

        .main-content {
            display: flex;
            gap: 10px;
            flex: 1px;
        }

        article {
            flex: 3;
            background-color: azure;
            padding: 15px;
            border: 3px solid black;
            flex-direction: column;
            gap: 10px;
        }

        section {
            background-color: beige;
            padding: 15px;
            border: 3px solid black;
            flex: 1;
            display: flex;
            align-items: center;
        }

        aside {
            flex: 1;
            background-color: yellowgreen;
            padding: 15px;
            border: 3px solid black;
        }

        footer {
            background-color: blueviolet;
            padding: 15px;
            text-align: left;
            font-weight: bold;
            border: 3px solid black;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <img src="/Pratikum 1/Assets/img/images.jpg" alt="" width="150px">
            <p>ini website ku </p>
        </header>

        <nav>
            nav
        </nav>

        <div class="main-content">
            <article>
                article 
                <section>sec</section>
                <section>sec</section>
                <section>sec</section>
            </article>

            <aside>
                aside
            </aside>
        </div>

        <footer>

        </footer>
    </div>
</body>
</html>
