<!DOCTYPE html>

<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Sekolah Tinggi Teknologi Terpadu Nurul Fikri</title>
</head>
<body>
    <h1>Form Pemesanan Pizza</h1>
    <p>
        Silahkan Isi Pemesanan ini dengan lengkap dan benar
    </p>
    <form action="http://www.blackgoosebistro.com/pizza.php" method="post">
        <fielshet>
            <legend>Informasi Pemesanan</legend>
            <p>
                <label for="CustomerName">Nama :</label>
                <input type="text" id="CustomerName" name="CustomerName" required>
            </p>
            <p>
                <label for="Address">Address :</label>
                <input type="text" id="Address" name="address" required>
            </p>

            <p>
                <label for="Telephone">Telephone :</label>
                <input type="text" id="Telephone" name="Telephone" required>
            </p>

            <p>  
                <label for="Email">Email :</label>
                <input type="text" id="Email" name="Email" required>
            </p>
            <p>
                <label for="intruction">Intruksi Pemesanan :</label><br>
                <textarea
                    id="intruction"
                    name="intruction"
                    rows="4"
                    cols="50"
                    maxlength="400"
                    placeholder="no more than 400 character">
                </textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>Design your dream pizza</legend>
            <p><strong>pizza specs</p></strong>
            <p>pilih salah satu</p>

            <p>
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">classic white</label><br>

                <input type="radio" id="peperoni" name="crust" value="peperoni" required>
                <label for="classic">peperoni</label><br>

                <input type="radio" id="cheese" name="crust" value="cheese" required>
                <label for="classic">cheese</label><br>

                <input type="radio" id="mozzarella" name="crust" value="mozzarella" required>
                <label for="classic">mozzarella</label><br>
            </p>

            <p><strong>topping</strong></p>
            <p>
                <input type="checkbox" id="classic" name="topping" value="classic white" required>
                <label for="classic">classic white</label><br>

                <input type="checkbox" id="classic" name="topping" value="peperoni" required> 
                <label for="classic">peperoni</label><br>

                <input type="checkbox" id="classic" name="topping" value="cheese" required>
                <label for="classic">cheese</label><br>

                <input type="checkbox" id="classic" name="topping" value="mozzarella" required>
                <label for="classic">mozzarella</label><br>
            </p>

            <p>
                <label for="quantity">quantity :</label>
                <select id="quantity" name="quantity" required>
                    <option value="">--pilih jumlah--</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </p><br>
    </form>
</body>
</html>
